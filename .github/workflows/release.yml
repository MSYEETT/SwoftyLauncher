name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build, for example v0.2.0
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  native:
    name: Native loader
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # The native scripts pin their compilers to the maintainer's healthy cores (taskset -c 2-7,...),
      # which leaves two of a hosted runner's four. This shim drops the pin and runs the command as is.
      - name: Use every runner core
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/taskset" <<'EOF'
          #!/bin/sh
          [ "$1" = -c ] && shift 2
          exec "$@"
          EOF
          chmod +x "$RUNNER_TEMP/bin/taskset"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      # CI on main saves this cache; a tag can read main's caches but its own are of no use to the next tag.
      - name: Zig cache period
        id: zig-period
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore the Zig cache
        uses: actions/cache/restore@v6
        with:
          path: |
            native/build/zig-cache
            addons/re-optimization/native/build/zig-cache
          key: zig-${{ runner.os }}-0.16.0-${{ steps.zig-period.outputs.month }}-${{ hashFiles('native/**', 'addons/*/native/**', 'packages/sdk/include/**') }}
          restore-keys: zig-${{ runner.os }}-0.16.0-${{ steps.zig-period.outputs.month }}-

      - name: Build
        run: native/build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: native
          path: |
            native/dist/
            native/bundled/

  linux:
    name: Linux
    needs: native
    # The oldest supported runner gives the oldest glibc baseline, for SteamOS.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false

      # Only a run on main saves (a dry run dispatched from main warms the next tag); tag caches stay unread.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: GPUI system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libfreetype-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libvulkan-dev

      - name: Build
        run: cargo build --release --workspace

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Build Swofty UI
        run: |
          python -m pip install pyinstaller==6.22.3
          python tools/swofty-ui/build.py
          dist/swofty-ui/swofty-ui --self-test

      - uses: actions/download-artifact@v8
        with:
          name: native
          path: native

      - name: Package
        run: |
          out=swofty-launcher-$TAG-linux-x86_64
          mkdir -p $out/bin $out/loader $out/addons $out/share/applications $out/share/icons/hicolor/256x256/apps $out/share/icons/hicolor/512x512/apps $out/share/icons/hicolor/scalable/apps
          cp target/release/swofty target/release/swofty-launcher dist/swofty-ui/swofty-ui $out/bin/
          cp -r native/dist/. $out/loader/
          cp native/bundled/*.swoftyaddon $out/addons/
          cp apps/launcher/assets/net.swofty.ModLauncher.desktop tools/swofty-ui/res/net.swofty.SwoftyUI.desktop $out/share/applications/
          cp apps/launcher/assets/icon-256.png $out/share/icons/hicolor/256x256/apps/net.swofty.ModLauncher.png
          cp apps/launcher/assets/icon-512.png $out/share/icons/hicolor/512x512/apps/net.swofty.ModLauncher.png
          cp apps/launcher/assets/icon.svg $out/share/icons/hicolor/scalable/apps/net.swofty.ModLauncher.svg
          cp tools/swofty-ui/res/icon-256.png $out/share/icons/hicolor/256x256/apps/net.swofty.SwoftyUI.png
          cp tools/swofty-ui/res/icon-512.png $out/share/icons/hicolor/512x512/apps/net.swofty.SwoftyUI.png
          cp LICENSE README.md THIRD_PARTY.md $out/
          tar czf $out.tar.gz $out

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: swofty-launcher-*.tar.gz

  windows:
    name: Windows
    needs: native
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false

      # Only a run on main saves (a dry run dispatched from main warms the next tag); tag caches stay unread.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        run: cargo build --release --workspace

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.22.3

      - name: Build Swofty UI
        run: python tools/swofty-ui/build.py

      - name: Self-test Swofty UI
        run: dist/swofty-ui/swofty-ui.exe --self-test

      - uses: actions/download-artifact@v8
        with:
          name: native
          path: native

      - name: Package
        shell: pwsh
        run: |
          $out = "swofty-launcher-$env:TAG-windows-x86_64"
          New-Item -ItemType Directory -Force "$out/bin", "$out/loader", "$out/addons" | Out-Null
          Copy-Item target/release/swofty.exe, target/release/swofty-launcher.exe, dist/swofty-ui/swofty-ui.exe "$out/bin/"
          Copy-Item -Recurse native/dist/* "$out/loader/"
          Copy-Item native/bundled/*.swoftyaddon "$out/addons/"
          Copy-Item LICENSE, README.md, THIRD_PARTY.md "$out/"
          Compress-Archive -Path $out -DestinationPath "$out.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: swofty-launcher-*.zip

  publish:
    name: Publish the release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artefacts
          merge-multiple: true

      - name: Checksums
        working-directory: artefacts
        run: sha256sum swofty-launcher-* > SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: |
            artefacts/swofty-launcher-*
            artefacts/SHA256SUMS
